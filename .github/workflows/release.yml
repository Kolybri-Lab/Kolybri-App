name: Release

on:
  push:
    tags: ['v*']

jobs:
  apk-github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build APK on EAS
        run: |
          eas build --platform android --profile github-apk \
            --non-interactive --wait --json > build.json
          echo "APK_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)" >> $GITHUB_ENV

      - name: Download builded APK
        run: curl -L "$APK_URL" -o "app-${{ github.ref_name }}.apk"

      - name: Create release on github
        uses: softprops/action-gh-release@v2
        with:
          files: app-${{ github.ref_name }}.apk
          generate_release_notes: true

  aab-play-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Build AAB + submit to Play Store
        run: |
          eas build --platform android --profile production \
            --non-interactive --wait --auto-submit
